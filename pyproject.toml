[project]
name = "registry"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click==8.3.3",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "ty==0.0.37",
    "uvicorn==0.47.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.13",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/**/test_*.py", "src/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
